<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 116" width="100%" height="116">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>

    <linearGradient id="neu-key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="100%" stop-color="#10151E"/>
    </linearGradient>

    <filter id="key-shadow" x="-8%" y="-14%" width="118%" height="134%">
      <feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#253144" flood-opacity="0.6" result="l"/>
      <feDropShadow dx="4" dy="4" stdDeviation="4.5" flood-color="#040609" flood-opacity="0.9" result="d"/>
      <feMerge>
        <feMergeNode in="d"/>
        <feMergeNode in="l"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="116" rx="14" fill="url(#bg)"/>

  <!-- Row 1: 3 Tactile Neumorphic Hardware Keys -->
  <!-- Key 1: Altium Designer -->
  <g transform="translate(18, 12)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#FF6044" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">ALTIUM DESIGNER</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#FF6044">ECAD / PCB</text>
  </g>

  <!-- Key 2: STM32 -->
  <g transform="translate(298, 12)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#00F0FF" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">STM32 CORTEX-M</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#00F0FF">HAL / LL / DMA</text>
  </g>

  <!-- Key 3: ESP32 -->
  <g transform="translate(578, 12)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#FF2A6D" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">ESP32 / ESP-IDF</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#FF2A6D">WIFI / BLE / MCU</text>
  </g>

  <!-- Row 2: 3 Tactile Neumorphic Hardware Keys -->
  <!-- Key 4: FreeRTOS -->
  <g transform="translate(18, 64)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#00F0FF" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">FREERTOS KERNEL</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#00F0FF">REAL-TIME OS</text>
  </g>

  <!-- Key 5: Analog & Digital Circuits -->
  <g transform="translate(298, 64)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#FF6044" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">ANALOG &amp; DIGITAL</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#FF6044">FILTERS / OP-AMP</text>
  </g>

  <!-- Key 6: SciPy & Real-Time DSP -->
  <g transform="translate(578, 64)">
    <rect width="264" height="40" rx="9" fill="url(#neu-key)" stroke="#243044" stroke-width="1" filter="url(#key-shadow)"/>
    <circle cx="20" cy="20" r="4" fill="#FF2A6D" filter="url(#glow)"/>
    <text x="34" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F0F6FC">SCIPY &amp; DSP</text>
    <text x="248" y="24" text-anchor="end" class="mono" font-size="9.5" fill="#FF2A6D">SIGNAL PROC</text>
  </g>
</svg>
